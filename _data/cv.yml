- title: Research Projects
  type: time_table
  contents:
    - title: Chickpea Fusarium Wilt Detector — MSDS Thesis
      year: 2025–2026
      institution: Batangas State University
      description:
        - "Development of Hybrid Lightweight CNN Integrating SqueezeNet and CBAM for Edge Deployment Using Multi-Data Sources"
        - "Designed a novel hybrid CNN (SqueezeNet v1.1 + CBAM attention module) achieving 82.09% cross-domain accuracy on unseen Myanmar field test set — outperforming MobileNetV2, EfficientNet-B0, and ShuffleNet"
        - "Applied INT8 static quantisation: 3.31× model compression (final size: 0.870 MB) for real-time mobile inference with zero accuracy degradation; benchmarked across 115 real Android devices via Google AI Edge Portal (worst-case CPU-only inference: 73.7 ms, compatible with 2 GB RAM / Android 9.0+)"
        - "Personally collected validated field dataset from farming communities across Myanmar using consumer smartphones; expert agronomist annotation; inter-rater reliability validated with Cohen's κ"
        - "Full statistical validation: Wilcoxon signed-rank test, two-proportion z-test with Wilson confidence intervals, McNemar's test, 5-fold stratified cross-validation across all architecture variants"
        - "Tech Stack: PyTorch, TFLite/LiteRT, Roboflow, ai-edge-quantizer, Google AI Edge Portal, Kaggle GPU (P100/T4), Git, Kotlin"
    - title: Bean Disease Classification via Stepwise CNN Fine-Tuning
      year: 2025
      institution: MSDS Coursework
      description:
        - "Improving Bean Disease Classification with Stepwise Fine-Tuning of CNN-based Transfer Learning Models"
        - "Benchmarked 5 pretrained CNN architectures (VGG16, ResNet50, DenseNet121, EfficientNet-B0, MobileNetV2); identified ResNet50 as optimal backbone"
        - "Designed stepwise fine-tuning strategy with progressive unfreezing of layers achieving 98.86% test accuracy; fully reproducible end-to-end pipeline in a single Kaggle notebook"
        - "Tech Stack: Python, TensorFlow/Keras, Kaggle GPU"
    - title: Shwe Taungthuu — Myanmar Agricultural Advisory Agent
      year: 2026
      institution: Google Build with AI MMDT 2026
      description:
        - "AI-powered bilingual agricultural advisory app for Myanmar farmers presented at Google Developers Community Build with AI MMDT 2026"
        - "Built and deployed a full-stack agricultural AI application using Gemini 2.5 Flash via Vertex AI for real-time advisory generation; Myanmar farmers ask crop and pest management questions via Burmese voice or text"
        - "Backend: Python + FastAPI on Google Cloud Run (serverless), keyless ADC authentication; Frontend: Web Speech API (browser-native voice-to-text), Tailwind CSS"
        - 'Live Application: <a href="https://myanmar-agri-agent-599279558972.us-central1.run.app" target="_blank">myanmar-agri-agent</a>'
    - title: Wikipedia Web Traffic Prediction via Time Series Modelling
      year: 2025
      institution: MSDS Coursework
      description:
        - "Comparative study of 7 time-series models (Moving Average, Exponential Smoothing, ARMA, ARIMA, Auto-ARIMA, Prophet, LSTM) on 145,000-article Kaggle competition dataset; evaluated with RMSE"
        - "Tech Stack: R, ARIMA, Prophet, LSTM"
