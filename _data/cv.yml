- title: Professional Summary
  type: list
  contents:
    - ML/AI researcher specialising in computer vision, natural language processing (NLP), efficient deep learning, and edge AI.
    - Currently pursuing a Doctor of Philosophy in Engineering Education at Batangas State University, serving as a Research Assistant at Batangas State University, and contributing as a Researcher at MMDT-RISE.
    - Combines academic research with practical engineering to develop scalable AI solutions for real-world deployment across agriculture, public health, and enterprise IT.
    - Expertise includes deep learning frameworks (PyTorch, TensorFlow, LiteRT), cloud-native AI systems (GCP, AWS, Docker, FastAPI), data analytics (Python, SQL, GIS), and edge model optimization.
    - Designs and delivers AI education initiatives, including developing an "Introduction to Applied AI" curriculum for Chin State youth and mentoring Python programming for Myanmar Data Tech.
    - Supported by seven years of field technology experience bridging methodological innovation with real-world impact.

